<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>B5 Reminder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f172a;--card:#1e293b;--blue:#2563eb;--red:#ef4444;--pink:#fecdd3;--txt:#f1f5f9;--mut:#94a3b8;--line:#334155;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:0 auto;padding:0 12px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:18px;margin:0;color:#3b82f6;font-weight:800;white-space:nowrap}
.mid{display:flex;gap:6px;align-items:center}
.ib{background:var(--card);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.user{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 8px 3px 3px;position:relative}
.av{width:28px;height:28px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700}
select{background:transparent;color:var(--txt);border:0;font-size:12px;max-width:92px;outline:0}
select option{background:var(--card)}
.row{display:flex;gap:8px;margin:6px 0}
.inp{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:22px;padding:11px 14px;font-size:14px;outline:0;min-width:0}
.sel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:0 8px;max-width:130px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.k{border-radius:16px;padding:12px;min-height:92px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.k b{font-size:26px}.k span{font-size:11px;opacity:.9}.k i{font-style:normal;font-size:18px}
.k1{background:var(--blue)}.k2{background:var(--pink);color:#7f1d1d}.k3{background:#020617;border:1px solid var(--line)}
.badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:2px 6px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{white-space:nowrap;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet{color:#4ade80;border-color:#166534}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;position:relative}
.task.od{border-color:#7f1d1d}.task.done{opacity:.6}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:30px}
.b{font-size:11px;border-radius:8px;padding:3px 8px;font-weight:600}
.bf{background:rgba(37,99,235,.2);color:#60a5fa}.bv{background:#334155;color:#cbd5e1}
.ttl{font-weight:700;margin:10px 0 6px;line-height:1.35}
.meta{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.meta .late{color:#fb7185;font-weight:600}
.bs{background:#3b0764;color:#d8b4fe}.more{display:block;margin:14px auto}
.dash{display:none;position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 40px}
.dash .in{max-width:720px;margin:0 auto}.dash h3{margin:16px 0 8px;font-size:14px;color:#93c5fd}
.dk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dk .k{min-height:72px}
.tw{overflow-x:auto;background:var(--card);border-radius:14px;margin-bottom:6px}
.tw table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tw th,.tw td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tw th:first-child,.tw td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.tw th{color:var(--mut);font-weight:600}.tw tr.tot td{font-weight:700;color:#93c5fd}
.sm{font-size:11px;padding:5px 9px;border-radius:8px;background:var(--blue);color:#fff;border:0;margin-left:4px;cursor:pointer}
.sm.g{background:#166534}.vn{cursor:pointer;text-decoration:underline dotted}
.dots{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
.menu{position:absolute;top:36px;right:8px;background:#0b1220;border:1px solid var(--line);border-radius:12px;z-index:4;overflow:hidden;min-width:150px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);padding:10px 14px;font-size:13px;cursor:pointer}
.menu button:hover{background:var(--card)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#020617;border-top:1px solid var(--line);display:none;justify-content:space-between;align-items:center;z-index:6}
.bar.on{display:flex}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheetm{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheetm .inp{border-radius:12px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:20}
.empty{text-align:center;color:var(--mut);padding:30px}
</style>
</head>

<header>

  <div class="mid">

    <button class="ib" id="sync" title="Sync">⟳</button>

  </div>
  <div class="user"><div class="av" id="av">NV</div><select id="usr"></select></div>

<div class="row">

<div class="kpis">

</div>

<div class="pills" id="pills">
  <button class="pill sheet" id="sheetBtn">▦ Sheet Sync</button>
  <button class="pill" id="memb" style="display:none">👥 Members</button>
  <button class="pill" id="dashBtn">📊 Dashboard</button>
  <button class="pill on" data-f="all">All</button>
  <button class="pill" data-f="over">Overdue</button>
  <button class="pill" data-f="today">Due Today</button>
  <button class="pill" data-f="done">Completed</button>
</div>

<div id="list"></div>

<div class="bar" id="bar"><span id="selc">0 selected</span><span style="display:flex;gap:8px"><button class="btn" id="asg">Assign</button><button class="btn" id="exp">⬇ Export CSV</button></span></div>

<div class="modal" id="mod"><div class="sheetm" id="modc"></div></div>
<div class="dash" id="dash"></div>
<div class="toast" id="toast"></div>

function stats(){
  const L=mine();
  const yrs=[...new Set(L.map(t=>String(t.year)).filter(Boolean))].sort();
  const vm={};L.forEach(t=>{const v=t.village||"(none)";(vm[v]=vm[v]||[]).push(t)});
  const vil=Object.entries(vm).map(([name,rows])=>({name,rows,y:yrs.map(y=>rows.filter(t=>String(t.year)===y).length),total:rows.length,closed:rows.filter(t=>t.cat==="Closed").length,cs:rows.filter(t=>t.cat==="Close Stage").length,over:rows.filter(isOver).length})).sort((a,b)=>b.total-a.total);
  const cats=[...CATS,...[...new Set(L.map(t=>t.cat))].filter(c=>c&&!CATS.includes(c))];
  return{L,yrs,vil,cats};
}

async function makeXlsx(groups,fname,withSummary){

  const wb=XLSX.utils.book_new(),used=new Set();
  const hdr=["SL No.","File No.","Section","Year","Village / Subject","Subject","Original Status","Status Category","Remarks","Last Action","Next Reminder","Completed","Follow-up Remarks","Assigned To"];
  const row=t=>[t.id,t.fileNo,t.section,t.year,t.village,t.title,t.orig,t.cat,t.remarks,t.last,t.due,t.done?"Yes":"No",t.follow||"",t.assignee||""];
  const add=(name,aoa,w)=>{let n=name.replace(/[\\\/?*\[\]:]/g,"-").slice(0,31),k=1;while(used.has(n.toLowerCase()))n=n.slice(0,28)+"-"+(++k);used.add(n.toLowerCase());const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)};
  if(withSummary&&DS)add("Summary",[["Village / Subject",...DS.yrs,"Total","Closed","Close Stage","Active","Overdue"],...DS.vil.map(v=>[v.name,...v.y,v.total,v.closed,v.cs,v.total-v.closed,v.over])],[26,8,8,8,8,8,10,10,12,10,10]);
  groups.forEach(g=>add(g.name,[hdr,...g.rows.map(row)],[8,22,8,6,18,50,16,18,40,12,12,10,30,16]));
  try{XLSX.writeFile(wb,fname);toast("Excel ready")}catch(e){toast("Download not allowed here")}
}
async function makePdf(groups,title,fname){
  toast("Preparing PDF...");
  try{await need("jspdf")}catch(e){return toast("PDF library needs internet once")}
  const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const PW=842,PH=595,M=28,K=2,F='"Noto Sans Malayalam","Noto Sans","Segoe UI",Roboto,Arial,sans-serif';
  const cols=[["SL",32,t=>t.id],["File No",108,t=>t.fileNo],["Subject",250,t=>t.title],["Status",80,t=>t.cat],["Remarks",200,t=>t.remarks],["Next",66,t=>t.due||"-"],["Done",50,t=>t.done?"Yes":"No"]];
  let cv,cx,y,pg=0,first=true;
  const flush=()=>{if(!cv)return;cx.fillStyle="#64748b";cx.font=`8px ${F}`;cx.fillText(`B5 Reminder · ${title} · Page ${pg}`,M,PH-16);if(!first)pdf.addPage();first=false;pdf.addImage(cv.toDataURL("image/jpeg",.85),"JPEG",0,0,PW,PH)};
  const page=()=>{flush();pg++;cv=document.createElement("canvas");cv.width=PW*K;cv.height=PH*K;cx=cv.getContext("2d");cx.scale(K,K);cx.fillStyle="#fff";cx.fillRect(0,0,PW,PH);cx.textBaseline="top";y=M};
  const head=()=>{cx.fillStyle="#1e293b";cx.fillRect(M,y,PW-2*M,16);cx.fillStyle="#fff";cx.font=`bold 8.5px ${F}`;let x=M;cols.forEach(c=>{cx.fillText(c[0],x+3,y+4);x+=c[1]});y+=18};
  const wrap=(txt,w)=>{cx.font=`8.5px ${F}`;const out=[];String(txt??"").split("\n").forEach(p=>{let l="";p.split(/\s+/).forEach(wd=>{if(!wd)return;const t=l?l+" "+wd:wd;if(cx.measureText(t).width<=w){l=t;return}if(l)out.push(l);l="";for(const ch of Array.from(wd)){if(cx.measureText(l+ch).width>w){out.push(l);l=ch}else l+=ch}});out.push(l)});return out.slice(0,6)};
  page();cx.fillStyle="#0f172a";cx.font=`bold 15px ${F}`;cx.fillText(title,M,y);y+=22;cx.font=`9px ${F}`;cx.fillStyle="#475569";cx.fillText("Generated "+today+" by "+S.user,M,y);y+=18;
  for(const g of groups){
    if(y>PH-90)page();
    cx.fillStyle="#2563eb";cx.fillRect(M,y,PW-2*M,18);cx.fillStyle="#fff";cx.font=`bold 10px ${F}`;cx.fillText(`${g.name}  ·  ${g.rows.length} files  ·  ${g.rows.filter(isOver).length} overdue`,M+4,y+4);y+=22;head();
    g.rows.forEach((t,i)=>{
      const cells=cols.map(c=>wrap(c[2](t),c[1]-6));
      const h=Math.max(...cells.map(a=>a.length))*11+6;
      if(y+h>PH-30){page();head()}
      if(isOver(t)){cx.fillStyle="#fee2e2";cx.fillRect(M,y,PW-2*M,h)}else if(i%2){cx.fillStyle="#f1f5f9";cx.fillRect(M,y,PW-2*M,h)}
      cx.fillStyle="#0f172a";cx.font=`8.5px ${F}`;let x=M;
      cells.forEach((a,ci)=>{a.forEach((ln,li)=>cx.fillText(ln,x+3,y+3+li*11));x+=cols[ci][1]});
      y+=h;
    });
    y+=10;
  }
  flush();
  try{pdf.save(fname);toast("PDF ready")}catch(e){toast("Download not allowed here")}
}
async function pushUser(action,member){try{await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,member,user:S.user})})}catch(e){}}
function setAv(){$("#av").textContent=S.user.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
function render(){
  const all=mine();
  const vs=[...new Set(all.map(t=>t.village).filter(Boolean))].sort();
  $("#vil").innerHTML='<option value="">All Villages</option>'+vs.map(v=>`<option ${v===S.v?"selected":""}>${esc(v)}</option>`).join("");
  $("#kt").textContent=all.length;$("#ko").textContent=all.filter(isOver).length;$("#kd").textContent=all.filter(isToday).length;
  let l=all.filter(t=>{
    const s=(t.fileNo+" "+t.title+" "+t.village).toLowerCase();
    if(S.q&&!s.includes(S.q.toLowerCase()))return false;
    if(S.v&&t.village!==S.v)return false;
    if(S.f==="over")return isOver(t);if(S.f==="today")return isToday(t);if(S.f==="done")return isDone(t);return true;
  }).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")*(S.asc?1:-1));
  $("#list").innerHTML=l.length?l.slice(0,S.lim).map(card).join("")+(l.length>S.lim?`<button class="pill more" data-more="1">Show more (${l.length-S.lim} left)</button>`:""):'<div class="empty">No tasks found. Files appear here once the admin assigns them to you.</div>';
  $("#bar").classList.toggle("on",S.sel.size>0);$("#selc").textContent=S.sel.size+" selected";$("#memb").style.display=isAdmin()?"":"none";$("#asg").style.display=isAdmin()?"":"none";
}
function card(t){
  const days=t.due?Math.round((new Date(t.due)-new Date(today))/864e5):null;
  const dl=isDone(t)?"Completed":days===null?"No reminder date":days<0?`Overdue by ${-days}d`:days===0?"Due today":`Due in ${days}d`;
  return `<div class="task ${isOver(t)?"od":""} ${isDone(t)?"done":""}">
  <div class="top"><input type="checkbox" data-sel="${t.id}" ${S.sel.has(t.id)?"checked":""}>
  <span class="b bf">${esc(t.fileNo)}</span><span class="b bv">${esc(t.village)}</span><span class="b bs">${esc(t.cat)}</span></div>
  <button class="dots" data-dots="${t.id}">⋮</button>
  <div class="ttl">${esc(t.title)}</div>
  ${t.remarks?`<div class="meta" style="margin-bottom:6px">📝 ${esc(t.remarks.slice(0,160))}</div>`:""}
  <div class="meta"><span class="${isOver(t)?"late":""}">📅 ${esc(t.due||"-")} · ${dl}</span><span>${esc(t.section)} · ${esc(t.year)}</span><span>👤 ${esc(t.assignee||"Unassigned")}</span>${t.orig?`<span>${esc(t.orig.slice(0,30))}</span>`:""}${S.rem[t.id]?`<span>🔔 ${esc(S.rem[t.id])}</span>`:""}</div></div>`;
}
function menu(id,el){
  document.querySelectorAll(".menu").forEach(m=>m.remove());
  const m=document.createElement("div");m.className="menu";
  m.innerHTML=["Edit","Change Status","Set Reminder","Delete"].map(a=>`<button data-act="${a}" data-id="${id}">${a}</button>`).join("");
  el.parentNode.appendChild(m);
}
function modal(html){$("#modc").innerHTML=html;$("#mod").classList.add("on")}
const close=()=>$("#mod").classList.remove("on");
function act(a,id){
  const t=S.tasks.find(x=>x.id==id);if(!t)return;
  if(a==="Delete"){if(confirm("Delete this task?")){S.tasks=S.tasks.filter(x=>x.id!=id);S.sel.delete(t.id);save();render();push("delete",t)}}
  if(a==="Change Status"){
    modal(`<b>Change status</b><button class="btn" data-st="done">✔ Mark completed</button><button class="btn" data-st="fu">↻ Follow-up done (next in ${t.freq||7} days)</button><button class="btn" data-st="open">Reopen</button>`);
    document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
      const v=b.dataset.st;
      if(v==="done"){t.done=true;t.last=today}
      if(v==="fu"){const d=new Date();d.setDate(d.getDate()+(t.freq||7));t.last=today;t.due=iso(d);t.done=false}
      if(v==="open")t.done=false;
      save();close();render();push("update",t);toast("Updated")});
  }
  if(a==="Set Reminder"){modal(`<b>Set reminder</b><input class="inp" type="datetime-local" id="rd"><button class="btn" id="rs">Save reminder</button>`);$("#rs").onclick=()=>{const v=$("#rd").value;if(!v)return;S.rem[t.id]=v.replace("T"," ");save();close();render();askNotif();toast("Reminder set")}}
  if(a==="Edit"){modal(`<b>Edit file</b><input class="inp" id="e1" value="${esc(t.fileNo)}"><input class="inp" id="e2" value="${esc(t.village)}"><input class="inp" id="e3" value="${esc(t.title)}"><input class="inp" id="e5" placeholder="Remarks" value="${esc(t.remarks)}"><label style="font-size:12px;color:#94a3b8">Next reminder date</label><input class="inp" type="date" id="e4" value="${esc(t.due)}">${isAdmin()?`<label style="font-size:12px;color:#94a3b8">Assign to</label><select class="inp" id="e6"><option value="">Unassigned</option>${names().map(u=>`<option ${u===t.assignee?"selected":""}>${esc(u)}</option>`).join("")}</select>`:""}<button class="btn" id="es">Save</button>`);$("#es").onclick=()=>{Object.assign(t,{fileNo:$("#e1").value,village:$("#e2").value,title:$("#e3").value,remarks:$("#e5").value,due:$("#e4").value});if($("#e6"))t.assignee=$("#e6").value;save();close();render();push("update",t)}}
}
function askNotif(){try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function checkRem(){
  const now=new Date().toISOString().slice(0,16).replace("T"," ");
  const d=new Date();const loc=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  for(const id in S.rem){if(S.rem[id]<=loc){const t=S.tasks.find(x=>x.id==id);delete S.rem[id];save();render();if(t){toast("🔔 "+t.fileNo);try{if(Notification.permission==="granted")new Notification("B5 Reminder",{body:t.fileNo+" - "+t.title})}catch(e){}}}}
}
async function push(action,t){ // write-back to Apps Script (needs doPost in your script)
  try{await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,task:t,user:S.user})})}catch(e){}
}
async function sync(){
  $("#sync").classList.add("spin");$("#cloud").textContent="🔄";
  try{
    const r=await fetch(API+"?action=getTasks");const j=await r.json();
    const arr=Array.isArray(j)?j:(j.tasks||j.data||[]);
    if(j&&Array.isArray(j.users))S.users=j.users.map(u=>({name:u.name,role:u.role,hash:u.hash||""}));
    S.tasks=arr.map((x,i)=>({id:x["SL No."]??x.id??i+1,fileNo:x["File No."]||x.fileNo||"",village:x["Concerned Village / Subject"]||x.village||"",title:x.Subject||x.title||"",remarks:x.Remarks||x.remarks||"",cat:x["Status Category"]||x.cat||"",orig:x["Original Status"]||x.orig||"",section:x.Section||x.section||"",year:x["File Year"]||x.year||"",due:String(x["Next Reminder Date"]||x.due||"").slice(0,10),last:String(x["Last Action Date"]||x.last||"").slice(0,10),freq:+(x["Reminder Frequency (Days)"]||x.freq)||7,assignee:x["Assigned To"]||x.assignee||"",follow:x["Follow-up Remarks"]||x.follow||"",done:/^yes$/i.test(x["Reminder Completed"])||x.done===true}));
    save();userSel();render();if(!S.gated){S.gated=1;gate()}$("#cloud").textContent="☁️";toast("Synced "+S.tasks.length+" tasks");
  }catch(e){if(!S.users.length)gate();$("#cloud").textContent="⚠️";toast("Offline - showing saved data")}
  $("#sync").classList.remove("spin");
}
function exportCsv(){
  const rows=S.tasks.filter(t=>S.sel.has(t.id));
  const c=[["File No","Village","Subject","Next Reminder","Category","Original Status","Remarks","Completed"],...rows.map(t=>[t.fileNo,t.village,t.title,t.due,t.cat,t.orig,t.remarks,t.done?"Yes":"No"])].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="b5-tasks.csv";a.click();toast("Exported "+rows.length);
}
document.addEventListener("click",e=>{
  const g=e.target;
  if(g.dataset.sel){const id=+g.dataset.sel||g.dataset.sel;g.checked?S.sel.add(id):S.sel.delete(id);render();return}
  if(g.dataset.dots){menu(g.dataset.dots,g);return}
  if(g.dataset.act){act(g.dataset.act,g.dataset.id);document.querySelectorAll(".menu").forEach(m=>m.remove());return}
  if(g.dataset.f){S.f=g.dataset.f;S.lim=60;document.querySelectorAll("[data-f]").forEach(p=>p.classList.toggle("on",p===g));render();return}
  if(g.dataset.more){S.lim+=60;render();return}
  if(g.id==="mod"){close();return}
  if(!g.closest(".menu"))document.querySelectorAll(".menu").forEach(m=>m.remove());
});
$("#q").oninput=e=>{S.q=e.target.value;S.lim=60;render()};
$("#vil").onchange=e=>{S.v=e.target.value;S.lim=60;render()};
$("#srt").onclick=()=>{S.asc=!S.asc;toast(S.asc?"Due date: earliest first":"Due date: latest first");render()};
$("#usr").onchange=e=>{S.user=e.target.value;S.unlocked=false;setAv();save();render();gate()};
$("#memb").onclick=members;$("#dashBtn").onclick=openDash;
$("#sync").onclick=sync;$("#sheetBtn").onclick=sync;$("#exp").onclick=exportCsv;
$("#asg").onclick=()=>{modal(`<b>Assign ${S.sel.size} files</b><select class="inp" id="as"><option value="">Unassigned</option>${names().map(u=>`<option>${esc(u)}</option>`).join("")}</select><button class="btn" id="ak">Assign</button>`);$("#ak").onclick=()=>{const v=$("#as").value;S.tasks.forEach(t=>{if(S.sel.has(t.id)){t.assignee=v;push("update",t)}});S.sel.clear();save();close();render();toast("Assigned")}};
$("#alert").onclick=()=>{askNotif();const o=mine().filter(isOver).length,d=mine().filter(isToday).length;toast(`${o} overdue, ${d} due today`)};
init();sync();setInterval(checkRem,30000);
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
